[package]
name = "n"
version = "0.5.1"
edition = "2021"
description = "Interactively manage your Node.js versions"
license = "MIT"
repository = "https://github.com/THernandez03/n"
keywords = ["node", "nodejs", "version-manager", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "n"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
dialoguer = "0.12.0"
dirs-next = "2.0.0"
flate2 = "1.1.9"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.102"
tar = "0.4.45"
zip = "8.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
strip = true
